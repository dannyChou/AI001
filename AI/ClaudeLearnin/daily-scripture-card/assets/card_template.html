<!DOCTYPE html>
<!--
  每日經文早安賀卡 - 標準樣板
  使用方式：複製本檔，替換 REPLACE 標記處的內容，勿更動 CSS。
  明亮版（復活之後）：見 CLAUDE.md「明亮版配色」，替換 body 背景、--paper、太陽色與 .quote 邊框色。
  注意：內容區強調一律用 <strong>，切勿用 Markdown 星號。
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --paper:#F7F3EA;
    --bg:#E9E4DA;
    --ink:#3E3A33;
    --ink-soft:#7A756B;
    --sage:#8FA382;
    --wheat:#E3C282;
    --barn:#9A6B52;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:900px;
    background:radial-gradient(1200px 900px at 30% 20%, #F0EBE1 0%, var(--bg) 70%);
    font-family:"Noto Serif CJK TC","Noto Serif TC",serif;
    color:var(--ink);
    display:flex;justify-content:center;
    padding:60px 0;
  }
  .bookmark{
    width:640px;
    background:var(--paper);
    border-radius:28px;
    padding:70px 56px 60px;
    box-shadow:0 18px 50px rgba(90,80,60,.14);
    position:relative;
  }
  .bookmark::before{
    content:"";
    position:absolute;inset:16px;
    border:1.6px dashed #C9C1B0;
    border-radius:20px;
    pointer-events:none;
  }
  .art{display:flex;justify-content:center;margin-bottom:34px;}
  .date{
    text-align:center;
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:17px;letter-spacing:.55em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .date::after{
    content:"";display:block;width:30px;height:2px;
    background:#C9C1B0;margin:14px auto 0;
  }
  h1{
    text-align:center;
    /* 標題過長(9-10字)時：font-size 可縮至 38px、letter-spacing 可減至 .08~.10em */
    font-size:40px;font-weight:700;
    letter-spacing:.14em;
    margin:30px 0 10px;
  }
  .subtitle{
    text-align:center;
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:15px;letter-spacing:.42em;
    color:#B3AC9E;
    margin-bottom:28px; /* 有經節區塊時用 28px；若不放經節可改回 40px */
  }
  /* 標題後的經文引句區塊（選用）：放 1-2 節當日主題經文 */
  .verse{
    text-align:center;
    margin:0 20px 36px;
    padding:20px 20px 22px;
    background:#FCF8EF;
    border:1px solid #E7DFCC;
    border-radius:14px;
  }
  .verse .txt{
    font-size:18px;line-height:1.9;letter-spacing:.04em;color:#5A5346;
  }
  .verse .ref{
    display:block;margin-top:10px;
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:13px;letter-spacing:.16em;color:#B08A54;
  }
  p.body{
    font-size:21px;line-height:2.15;
    text-align:justify;
    letter-spacing:.06em;
    margin-bottom:30px;
  }
  .quote{
    border-left:3px solid #CFC7B4; /* 明亮版可改 #D8C58A */
    margin:36px 8px 40px 18px;
    padding:6px 6px 6px 26px;
    font-style:italic;
    font-size:20px;line-height:2.2;
    letter-spacing:.05em;
    color:#4A463E;
  }
  .footer{
    margin-top:46px;
    border-top:1px solid #DDD6C7;
    padding-top:26px;
    text-align:center;
  }
  .footer .en{
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:15px;letter-spacing:.4em;
    color:#B3AC9E;margin-bottom:14px;
  }
  .footer .bless{
    font-size:19px;font-weight:700;letter-spacing:.12em;
  }
</style>
</head>
<body>
<div class="bookmark">

  <!-- REPLACE: 置換為當日主題的 SVG 插圖。務必保留系列一致元素：晨光+淡化十字、木籬笆、野花、飛鳥、落葉、地面線。viewBox 用 0 0 440 300。 -->
  <div class="art">
    <svg width="440" height="300" viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#FBE9A6" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#F6E2A0" stop-opacity=".45"/>
          <stop offset="100%" stop-color="#F6E2A0" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- 晨光與隱約的十字光暈（系列一致，必備） -->
      <circle cx="352" cy="72" r="58" fill="url(#glow)"/>
      <circle cx="352" cy="72" r="21" fill="#F8E7A4"/>
      <line x1="352" y1="26" x2="352" y2="118" stroke="#EED992" stroke-width="2.4" opacity=".55"/>
      <line x1="312" y1="66" x2="392" y2="66" stroke="#EED992" stroke-width="2.4" opacity=".55"/>

      <!-- 遠方緩丘 -->
      <path d="M8 196 Q120 176 236 188 Q346 198 434 180"
            fill="none" stroke="#B9AE97" stroke-width="3" stroke-linecap="round" opacity=".7"/>

      <!-- REPLACE: 此處放當日主題的主體圖像（見 SKILL.md 對應表） -->

      <!-- 地面線 -->
      <line x1="40" y1="278" x2="404" y2="278" stroke="#C9BFA8" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>

      <!-- 木籬笆（左側，系列一致，必備） -->
      <line x1="50" y1="230" x2="50" y2="278" stroke="#A08A6E" stroke-width="4" stroke-linecap="round"/>
      <line x1="74" y1="226" x2="74" y2="274" stroke="#A08A6E" stroke-width="4" stroke-linecap="round"/>
      <line x1="36" y1="244" x2="88" y2="238" stroke="#A08A6E" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="36" y1="264" x2="88" y2="258" stroke="#A08A6E" stroke-width="3.2" stroke-linecap="round"/>

      <!-- 野花小草（系列一致） -->
      <path d="M104 278 C102 268 96 262 90 258" fill="none" stroke="#8FA382" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="88" cy="256" r="4.6" fill="#E3C282"/>
      <path d="M320 278 C322 270 326 264 332 260" fill="none" stroke="#8FA382" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="334" cy="258" r="4.2" fill="#D9A38B"/>

      <!-- 飛鳥（系列一致） -->
      <path d="M96 92 q9 -9 18 0 q9 -9 18 0" fill="none" stroke="#8B8474" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M150 112 q7 -7 14 0 q7 -7 14 0" fill="none" stroke="#A29B8B" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 落葉一枚（系列一致） -->
      <ellipse cx="392" cy="150" rx="10" ry="4.5" transform="rotate(-24 392 150)"
               fill="none" stroke="#C9B294" stroke-width="2.2"/>
    </svg>
  </div>

  <!-- REPLACE: 日期，格式 2026 / 07 / 31 -->
  <div class="date">2026 / 07 / 31</div>

  <!-- REPLACE: 中文主標題（生活化、非宗教語彙） -->
  <h1>今日主題標題</h1>
  <!-- REPLACE: 英文副標，全大寫 -->
  <div class="subtitle">ENGLISH SUBTITLE HERE</div>

  <!-- REPLACE（選用）：標題後經節區塊，放當日經文裡 1-2 節切合主題的經句。不需要時可整段刪除，並把 .subtitle 的 margin-bottom 改回 40px。 -->
  <div class="verse">
    <div class="txt">「當日主題經句（全繁體中文）。」</div>
    <span class="ref">尼希米記 12 : 24</span>
  </div>

  <!-- REPLACE 第1段：從普遍人性處境切入，先不談信仰 -->
  <p class="body">第一段：描述一種人人有共鳴的處境，讓讀者先對上號。</p>

  <!-- REPLACE 第2段：帶入聖經敘事，引用耶穌/經文原句。強調用 <strong>，勿用星號 -->
  <p class="body">第二段：聖經的馬可福音裡……（引用原句，直白而溫柔）。</p>

  <!-- REPLACE：凝鍊金句，斜體，濃縮主題，避免宗教術語 -->
  <div class="quote">「一句可獨立成立的雋永金句。」</div>

  <!-- REPLACE 第3段：拉回讀者的今天(用星期)，給溫柔行動，並以邀請收尾 -->
  <p class="body">第三段：週X的清晨，願你……。若你想認識……，歡迎有一天翻開馬可福音。</p>

  <div class="footer">
    <!-- REPLACE：當日經文出處，格式 MARK 16 : 19 – 20 -->
    <div class="en">MARK 16 : 19 – 20</div>
    <!-- REPLACE：祝福語，以「願神祝福你：」開頭 -->
    <div class="bless">願神祝福你：八字對稱短句</div>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<!--
  每日經文早安賀卡 - 標準樣板（2026/09 新版）
  版型：頂部橫幅 SVG 插畫（全出血，viewBox 0 0 800 380）→ 日期（葉飾+愛心分隔）→ 標題／副標
        → 經節框（選用）→ icon+標題+短文 段落區（生活共鳴／聖經背景／今日應用／週X清晨的亮光）
        → 引言框（葉飾+愛心）→ 頁尾（葉飾）。
  使用方式：複製本檔，替換 REPLACE 標記處的內容，勿更動 CSS。
  插圖風格：寫實場景基礎 × 手繪線條 × 輕水彩質感 × 現代美式生活美學（見 SKILL.md）。
            本檔渲染管線僅支援手寫 SVG（漸層/模糊濾鏡近似水彩與景深），非真正圖像生成模型畫風。
  苦難／沉重段落：可將 --sage-deep 標題色與 quote-box 背景改暗一階，banner 用暗色調+一線光+新芽；
            復活／歡慶段落：banner 用明亮版配色（見 SKILL.md 「明亮版配色」）。
  注意：內容區強調一律用 <strong>，切勿用 Markdown 星號。
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --paper:#F7F3EA;
    --bg:#E9E4DA;
    --ink:#3E3A33;
    --ink-soft:#7A756B;
    --sage:#8FA382;
    --sage-deep:#5F7554;
    --wheat:#E3C282;
    --barn:#9A6B52;
    --terracotta:#C97B5A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:900px;
    background:radial-gradient(1200px 900px at 30% 20%, #F0EBE1 0%, var(--bg) 70%);
    font-family:"Noto Serif CJK TC","Noto Serif TC",serif;
    color:var(--ink);
    display:flex;justify-content:center;
    padding:60px 0;
  }
  .bookmark{
    width:640px;
    background:var(--paper);
    border-radius:28px;
    box-shadow:0 18px 50px rgba(90,80,60,.14);
    position:relative;
    overflow:hidden;
  }
  .banner{width:100%;line-height:0;display:block;}
  .banner svg{width:100%;height:auto;display:block;}
  .content{padding:36px 52px 54px;}

  .date-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px;}
  .date-row svg{width:15px;height:15px;opacity:.55;}
  .date{
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:16px;letter-spacing:.5em;
    color:var(--ink-soft);
  }
  .date-divider{text-align:center;margin:12px 0 26px;}
  .date-divider svg{width:13px;height:13px;opacity:.6;}

  h1{
    text-align:center;
    /* 標題過長(9-10字)時：font-size 可縮至 38px、letter-spacing 可減至 .08~.10em；12字可縮至 34px/.04em */
    font-size:40px;font-weight:700;
    letter-spacing:.14em;
    margin:6px 0 10px;
  }
  .subtitle{
    text-align:center;
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:15px;letter-spacing:.42em;
    color:#B3AC9E;
    margin-bottom:28px; /* 不放經節框時可改回較大留白，如 40px */
  }
  /* 標題後的經文引句區塊（選用）：放 1-2 節當日主題經文 */
  .verse{
    text-align:center;
    margin:0 4px 32px;
    padding:20px 20px 22px;
    background:#FCF8EF;
    border:1px solid #E7DFCC;
    border-radius:16px;
  }
  .verse .txt{
    font-size:18px;line-height:1.9;letter-spacing:.04em;color:#5A5346;
  }
  .verse .ref{
    display:block;margin-top:10px;
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:13px;letter-spacing:.16em;color:#B08A54;
  }

  /* icon + 標題 + 短文 段落區（取代舊版 p.body 長段落） */
  .section{display:flex;gap:16px;align-items:flex-start;padding:17px 2px;}
  .section + .section{border-top:1px dashed #E3DBC8;}
  .icon-circle{
    flex:0 0 44px;width:44px;height:44px;border-radius:50%;
    background:#F1EAD9;display:flex;align-items:center;justify-content:center;
  }
  .icon-circle svg{width:22px;height:22px;}
  .section .stitle{
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:17px;font-weight:700;color:var(--sage-deep);
    letter-spacing:.04em;margin-bottom:5px;
  }
  .section .sbody{
    font-size:16.5px;line-height:1.85;letter-spacing:.02em;color:var(--ink);
  }

  .quote-box{
    margin:28px 2px;padding:22px 26px;
    background:#EFEAD9;border-radius:16px;
    display:flex;align-items:center;gap:12px;
  }
  .quote-box svg.leaf{width:18px;height:18px;flex:0 0 18px;opacity:.6;}
  .quote-box svg.heart{width:16px;height:16px;flex:0 0 16px;opacity:.65;}
  .quote-box .qtext{
    flex:1;font-style:italic;font-size:17.5px;line-height:1.85;
    letter-spacing:.03em;color:#4A463E;text-align:center;
  }

  .footer{
    margin-top:38px;padding-top:24px;
    border-top:1px solid #DDD6C7;
    text-align:center;
  }
  .footer .en{
    font-family:"Noto Sans CJK TC",sans-serif;
    font-size:15px;letter-spacing:.4em;
    color:#B3AC9E;margin-bottom:14px;
  }
  .footer .bless-row{display:flex;align-items:center;justify-content:center;gap:12px;}
  .footer .bless-row svg{width:15px;height:15px;opacity:.55;}
  .footer .bless{font-size:19px;font-weight:700;letter-spacing:.12em;}
</style>
</head>
<body>
<div class="bookmark">

  <!-- REPLACE：頂部橫幅插畫，全出血，viewBox 0 0 800 380。下方 defs 的 sky/ground 漸層與 bgBlur/mistBlur 濾鏡可重複使用；
       主體場景（木門、餐桌、山徑、器物等）依當日主題重繪，風格參考 SKILL.md「寫實場景×手繪線條×水彩質感×現代美式生活美學」。
       此範例場景為「木門半開＋暖光灑落薄霧地面＋掛鉤披肩＋陶盆植栽」，可直接沿用或替換主體。 -->
  <div class="banner">
    <svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EDE6D6"/>
          <stop offset="55%" stop-color="#F1E7D2"/>
          <stop offset="100%" stop-color="#F5E9D3"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#DED5BC"/>
          <stop offset="100%" stop-color="#CBBE9E"/>
        </linearGradient>
        <radialGradient id="doorglow" cx="50%" cy="40%" r="70%">
          <stop offset="0%" stop-color="#FDF1C4" stop-opacity="1"/>
          <stop offset="55%" stop-color="#F6E2A0" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#E3C282" stop-opacity=".65"/>
        </radialGradient>
        <filter id="bgBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="mistBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>

      <rect width="800" height="380" fill="url(#sky)"/>

      <!-- 晨光（自然日出，不刻意強調宗教符號） -->
      <circle cx="655" cy="92" r="72" fill="#F8E7A4" opacity=".35"/>
      <circle cx="655" cy="92" r="34" fill="#FCEFC0" opacity=".85"/>

      <!-- 遠山層次 -->
      <path d="M0 222 L90 176 L180 206 L280 166 L380 200 L480 170 L580 202 L680 178 L800 200 L800 380 L0 380 Z" fill="#B7BDAE" opacity=".32"/>
      <path d="M0 250 L100 216 L220 246 L340 206 L460 240 L580 210 L700 238 L800 218 L800 380 L0 380 Z" fill="#A6A78F" opacity=".28"/>

      <!-- 遠景朦朧樹影，營造景深 -->
      <ellipse cx="118" cy="232" rx="92" ry="110" fill="#8FA382" opacity=".22" filter="url(#bgBlur)"/>
      <ellipse cx="682" cy="238" rx="100" ry="115" fill="#8FA382" opacity=".2" filter="url(#bgBlur)"/>

      <!-- 小鳥 -->
      <path d="M150 100 q9 -9 18 0 q9 -9 18 0" fill="none" stroke="#8B8474" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
      <path d="M205 122 q7 -7 14 0 q7 -7 14 0" fill="none" stroke="#A29B8B" stroke-width="2" stroke-linecap="round" opacity=".55"/>

      <!-- 地面 -->
      <rect x="0" y="300" width="800" height="80" fill="url(#ground)"/>

      <!-- REPLACE：此處起為當日主題主體圖像，範例為「木門半開＋薄霧＋暖光」 -->
      <ellipse cx="400" cy="322" rx="180" ry="22" fill="#E8E4DC" opacity=".5" filter="url(#mistBlur)"/>
      <ellipse cx="300" cy="312" rx="90" ry="16" fill="#EDE9E1" opacity=".4" filter="url(#mistBlur)"/>
      <ellipse cx="500" cy="316" rx="100" ry="17" fill="#EDE9E1" opacity=".38" filter="url(#mistBlur)"/>
      <ellipse cx="404" cy="320" rx="96" ry="13" fill="#F6E2A0" opacity=".4" filter="url(#mistBlur)"/>

      <rect x="336" y="326" width="150" height="15" rx="2" fill="#C9BFA8" stroke="#B0A48A" stroke-width="1.3"/>

      <rect x="352" y="130" width="100" height="202" rx="4" fill="#7A5B42" stroke="#5C4530" stroke-width="2.4"/>
      <rect x="364" y="142" width="76" height="178" fill="url(#doorglow)"/>
      <rect x="300" y="140" width="48" height="184" rx="3" fill="#9A6B52" stroke="#6B4E38" stroke-width="1.8"/>
      <line x1="311" y1="147" x2="311" y2="317" stroke="#7A5B42" stroke-width="1.1" opacity=".55"/>
      <line x1="324" y1="147" x2="324" y2="317" stroke="#7A5B42" stroke-width="1.1" opacity=".45"/>
      <line x1="337" y1="147" x2="337" y2="317" stroke="#7A5B42" stroke-width="1.1" opacity=".5"/>
      <circle cx="341" cy="232" r="3.6" fill="#E3C282" stroke="#6B4E38" stroke-width="1"/>

      <line x1="474" y1="150" x2="474" y2="162" stroke="#6B4E38" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="474" cy="149" r="2.8" fill="#6B4E38"/>
      <path d="M459 161 Q453 200 464 232 Q474 243 484 232 Q475 200 478 161 Z"
            fill="#C97B5A" opacity=".88" stroke="#A85C3E" stroke-width="1.3"/>
      <path d="M464 176 q4 22 1 44" fill="none" stroke="#A85C3E" stroke-width="1" opacity=".5"/>
      <path d="M474 174 q2 24 -1 48" fill="none" stroke="#A85C3E" stroke-width="1" opacity=".4"/>

      <path d="M280 320 L296 320 L293 340 L283 340 Z" fill="#B0764F" stroke="#8A5C3C" stroke-width="1.2"/>
      <path d="M288 320 C284 302 276 296 270 292" fill="none" stroke="#6B7F5E" stroke-width="2" stroke-linecap="round"/>
      <path d="M288 320 C290 300 296 292 302 286" fill="none" stroke="#7C9268" stroke-width="2" stroke-linecap="round"/>
      <path d="M288 320 C288 298 288 290 288 282" fill="none" stroke="#8FA382" stroke-width="2" stroke-linecap="round"/>
      <!-- REPLACE 結束 -->
    </svg>
  </div>

  <div class="content">

  <!-- REPLACE：日期，格式 2026 / 07 / 31 -->
  <div class="date-row">
    <svg viewBox="0 0 24 24"><path d="M2 20 C2 10 10 4 20 2 C18 12 12 18 2 20Z" fill="#8FA382"/></svg>
    <span class="date">2026 / 07 / 31</span>
    <svg viewBox="0 0 24 24" transform="scale(-1,1)"><path d="M2 20 C2 10 10 4 20 2 C18 12 12 18 2 20Z" fill="#8FA382"/></svg>
  </div>
  <div class="date-divider">
    <svg viewBox="0 0 24 24"><path d="M12 20 C4 14 2 9 5 6 C7 4 10 5 12 8 C14 5 17 4 19 6 C22 9 20 14 12 20 Z" fill="#D9A38B"/></svg>
  </div>

  <!-- REPLACE：中文主標題（生活化、非宗教語彙） -->
  <h1>今日主題標題</h1>
  <!-- REPLACE：英文副標，全大寫 -->
  <div class="subtitle">ENGLISH SUBTITLE HERE</div>

  <!-- REPLACE（選用）：標題後經節區塊，放當日經文裡 1-2 節切合主題的經句。不需要時可整段刪除。 -->
  <div class="verse">
    <div class="txt">「當日主題經句（全繁體中文）。」</div>
    <span class="ref">尼希米記 12 : 24</span>
  </div>

  <!-- REPLACE 段落一：生活共鳴——從普遍人性處境切入，先不談信仰 -->
  <div class="section">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><path d="M4 10 Q12 4 20 10 L20 18 Q12 14 4 18 Z" fill="#C97B5A" opacity=".85"/></svg>
    </div>
    <div class="text">
      <div class="stitle">生活共鳴</div>
      <div class="sbody">描述一種人人有共鳴的處境，讓讀者先對上號。</div>
    </div>
  </div>

  <!-- REPLACE 段落二：聖經背景——帶入聖經敘事，引用原句。強調用 <strong>，勿用星號 -->
  <div class="section">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><path d="M12 5 C9 3 5 3 3 4 V18 C5 17 9 17 12 19 C15 17 19 17 21 18 V4 C19 3 15 3 12 5 Z" fill="none" stroke="#5F7554" stroke-width="1.6"/><line x1="12" y1="5" x2="12" y2="19" stroke="#5F7554" stroke-width="1.4"/></svg>
    </div>
    <div class="text">
      <div class="stitle">聖經背景</div>
      <div class="sbody">聖經的馬可福音裡……（引用原句，直白而溫柔，關鍵句用 <strong>強調</strong>）。</div>
    </div>
  </div>

  <!-- REPLACE：凝鍊金句，濃縮主題，避免宗教術語 -->
  <div class="quote-box">
    <svg class="leaf" viewBox="0 0 24 24"><path d="M2 20 C2 10 10 4 20 2 C18 12 12 18 2 20Z" fill="#8FA382"/></svg>
    <div class="qtext">「一句可獨立成立的雋永金句。」</div>
    <svg class="heart" viewBox="0 0 24 24"><path d="M12 20 C4 14 2 9 5 6 C7 4 10 5 12 8 C14 5 17 4 19 6 C22 9 20 14 12 20 Z" fill="#D9A38B"/></svg>
  </div>

  <!-- REPLACE 段落三：今日應用——溫柔的具體行動，不用命令語氣 -->
  <div class="section">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><path d="M4 16c2-6 6-10 8-10s6 4 8 10" fill="none" stroke="#9A6B52" stroke-width="1.8" stroke-linecap="round"/><path d="M4 16c0 3 3 4 8 4s8-1 8-4" fill="none" stroke="#9A6B52" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <div class="text">
      <div class="stitle">今日應用</div>
      <div class="sbody">給讀者一個溫柔、可以自己選擇的具體行動或提醒。</div>
    </div>
  </div>

  <!-- REPLACE 段落四：週X清晨的亮光——拉回讀者的今天(用星期)，以邀請收尾 -->
  <div class="section">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#E3C282"/><g stroke="#C9A227" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.5" y1="4.5" x2="6.5" y2="6.5"/><line x1="17.5" y1="17.5" x2="19.5" y2="19.5"/><line x1="4.5" y1="19.5" x2="6.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="19.5" y2="4.5"/></g></svg>
    </div>
    <div class="text">
      <div class="stitle">週X清晨的亮光</div>
      <div class="sbody">若你想認識……，歡迎有一天翻開聖經裡的馬可福音，繼續讀下去。</div>
    </div>
  </div>

  <div class="footer">
    <!-- REPLACE：當日經文出處，格式 MARK 16 : 19 – 20 -->
    <div class="en">MARK 16 : 19 – 20</div>
    <!-- REPLACE：祝福語，以「願神祝福你：」開頭 -->
    <div class="bless-row">
      <svg viewBox="0 0 24 24"><path d="M2 20 C2 10 10 4 20 2 C18 12 12 18 2 20Z" fill="#8FA382"/></svg>
      <div class="bless">願神祝福你：八字對稱短句</div>
      <svg viewBox="0 0 24 24" transform="scale(-1,1)"><path d="M2 20 C2 10 10 4 20 2 C18 12 12 18 2 20Z" fill="#8FA382"/></svg>
    </div>
  </div>

  </div>
</div>
</body>
</html>
